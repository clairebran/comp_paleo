{% extends 'base.html' %}
{% block title %}Add locality — Proxy Inventory{% endblock %}
{% block content %}
<h1>Add a locality</h1>
{% if error %}<p class="error">{{ error }}</p>{% endif %}
<p class="note">Fields marked * are required.</p>

<form method="post">
    <div class="field">
        <label for="country" class="required">Country</label>
        <input type="text" id="country" name="country" value="{{ form.get('country', '') }}" required>
    </div>
    <div class="field">
        <label for="site" class="required">Site</label>
        <input type="text" id="site" name="site" value="{{ form.get('site', '') }}" required>
    </div>
    <div class="field">
        <label for="formation" class="required">Formation</label>
        <input type="text" id="formation" name="formation" value="{{ form.get('formation', '') }}" required>
    </div>
    <div class="field">
        <label for="member" class="required">Member</label>
        <input type="text" id="member" name="member" value="{{ form.get('member', '') }}" required>
        <small>Enter "undifferentiated" if the source names no member.</small>
    </div>
    <div class="field">
        <label for="oldest_age_ma">Oldest age (Ma)</label>
        <input type="number" id="oldest_age_ma" name="oldest_age_ma" min="0" step="any" value="{{ form.get('oldest_age_ma', '') }}">
    </div>
    <div class="field">
        <label for="youngest_age_ma">Youngest age (Ma)</label>
        <input type="number" id="youngest_age_ma" name="youngest_age_ma" min="0" step="any" value="{{ form.get('youngest_age_ma', '') }}">
    </div>
    <button type="submit">Save locality</button>
    <a href="{{ url_for('list_localities') }}">Cancel</a>
</form>
{% endblock %}
