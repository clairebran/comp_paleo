{% extends 'base.html' %}
{% block title %}Add publication — Proxy Inventory{% endblock %}
{% block content %}
<h1>Add a publication</h1>
{% if error %}<p class="error">{{ error }}</p>{% endif %}
<p class="note">Fields marked * are required.</p>

<form method="post">
    <div class="field">
        <label for="citation" class="required">Citation (APA)</label>
        <input type="text" id="citation" name="citation" value="{{ form.get('citation', '') }}" required>
    </div>
    <div class="field">
        <label for="year">Year</label>
        <input type="number" id="year" name="year" min="1800" max="2100" value="{{ form.get('year', '') }}">
        <small>If given, the year must appear in the citation.</small>
    </div>
    <div class="field">
        <label for="doi">DOI</label>
        <input type="text" id="doi" name="doi" value="{{ form.get('doi', '') }}">
    </div>
    <button type="submit">Save publication</button>
    <a href="{{ url_for('list_publications') }}">Cancel</a>
</form>
{% endblock %}
